<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Просмотр пользователей</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fafafa;
    padding: 30px 16px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .subtitle { color: #8e8e8e; font-size: 14px; margin-bottom: 20px; }
  .back-link { display: inline-block; margin-bottom: 16px; color: #0095f6; text-decoration: none; font-size: 14px; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 6px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    font-size: 13px;
    border-bottom: 1px solid #efefef;
  }
  th {
    background: #fafafa;
    font-weight: 600;
    color: #262626;
  }
  tr:last-child td { border-bottom: none; }
  td.username { font-weight: 600; }
  .empty {
    text-align: center;
    padding: 40px;
    color: #8e8e8e;
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 6px;
  }
  .del-btn {
    background: #ed4956;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .refresh-btn {
    background: #0095f6;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<div class="container">
  <a class="back-link" href="/index.html">← Назад к странице входа</a>
  <h1>Все зарегистрированные пользователи</h1>
  <p class="subtitle">Данные хранятся в SQLite базе данных на сервере (файл users.db)</p>

  <button class="refresh-btn" id="refreshBtn">🔄 Обновить</button>

  <div id="tableWrap"></div>
</div>

<script>
  async function loadUsers() {
    const wrap = document.getElementById("tableWrap");
    try {
      const res = await fetch("/api/users");
      const users = await res.json();

      if (users.length === 0) {
        wrap.innerHTML = `<div class="empty">Пока никто не зарегистрировался.</div>`;
        return;
      }

      wrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Имя пользователя</th>
              <th>Полное имя</th>
              <th>Email</th>
              <th>Пароль</th>
              <th>Дата регистрации</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${users.map(u => `
              <tr>
                <td>${u.id}</td>
                <td class="username">${u.username}</td>
                <td>${u.fullname}</td>
                <td>${u.email}</td>
                <td>${u.password}</td>
                <td>${u.created_at}</td>
                <td><button class="del-btn" data-id="${u.id}">Удалить</button></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;

      document.querySelectorAll(".del-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          await fetch(`/api/users/${btn.dataset.id}`, { method: "DELETE" });
          loadUsers();
        });
      });
    } catch (err) {
      wrap.innerHTML = `<div class="empty">Не удалось связаться с сервером.</div>`;
    }
  }

  document.getElementById("refreshBtn").addEventListener("click", loadUsers);
  loadUsers();
</script>

</body>
</html>
